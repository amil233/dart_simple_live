name: app-build-action-dev

on:
  workflow_dispatch:
  push:
    tags:
      - "dev_v*"

jobs:
  build-android:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      # 1. 设置 Java
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      # 2. 设置 Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 3. 【签名配置】—— 仅当你需要正式签名 release APK 时才取消注释
      # 取消注释前，请务必在 GitHub 仓库的 Settings -> Secrets and variables -> Actions 中添加：
      #   KEYSTORE_BASE64   : 将你的 .jks 文件用 base64 编码后的字符串
      #   STORE_PASSWORD    : keystore 密码
      #   KEY_PASSWORD      : key 密码
      #   KEY_ALIAS         : key 别名
      # - name: Download Android keystore
      #   id: android_keystore
      #   uses: timheuer/base64-to-file@v1.2
      #   with:
      #     fileName: keystore.jks
      #     encodedString: ${{ secrets.KEYSTORE_BASE64 }}
      # - name: Create key.properties
      #   run: |
      #     echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > simple_live_app/android/key.properties
      #     echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> simple_live_app/android/key.properties
      #     echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> simple_live_app/android/key.properties
      #     echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> simple_live_app/android/key.properties

      # 4. 安装依赖
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 5. 构建 APK（release 模式，如果你不需要签名，请改成 --debug）
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --debug --split-per-abi

      # 6. 上传产物
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-debug.apk
