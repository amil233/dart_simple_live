name: Build Signed APK

on:
  workflow_dispatch:
  push:
    tags:
      - "dev_v*"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 0.提前声明使用 Node.js 24 环境，更彻底地消除警告
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 1. 签出代码
      - name: Checkout code
        uses: actions/checkout@v5  # 从 v4 更新
        with:
          ref: dev

      # 2. 从 GitHub Secrets 还原 keystore.jks (沿用旧版，但用纯shell实现作为替代)
      - name: Restore keystore
        id: keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/keystore.jks
          echo "filePath=${{ runner.temp }}/keystore.jks" >> $GITHUB_OUTPUT

      # 3. 生成 key.properties
      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.keystore.outputs.filePath }}" > simple_live_app/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> simple_live_app/android/key.properties

      # 4. 设置 Java 
      - name: Setup Java
        uses: actions/setup-java@v5 
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      # 5. 设置 Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 6. 安装依赖
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 7. 构建已签名的 APK
      - name: Build signed APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      # 8. 上传 APK 产物
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v5 
        with:
          name: android
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      - run: echo "✅ APK build finished."
